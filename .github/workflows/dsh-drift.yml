name: DSH drift

# DSH 本体の文言が変わっていないかを 1 日 1 回確認する。
#   - リポジトリ内に DSH を入れて tools/extract-dictionaries.mjs で辞書を再抽出する
#     (グローバルインストール -g は依存が dsh/node_modules にネストしてクライアント
#      バンドルが見えず 0 件になるため使わない。プロジェクト内なら npx と同じ平坦な配置になる)
#   - コミット済みの data/en-dictionaries.json と比べる (tools/drift-report.mjs)
#   - 差分があれば Issue を作り、ワークフローを失敗させる (定期実行の失敗は通知が届く)
#   - 抽出自体に失敗した場合は別の Issue を作る (誤検知と区別するため)
# 先行版 (alpha) まで早く見たい場合は、install を @deepseek-ai/dsh@alpha に変える。
on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install DSH into the project
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh

      - name: Show the installed version
        run: node -p "require('./node_modules/@deepseek-ai/dsh/package.json').version"

      - name: Save the committed dictionary as the comparison base
        run: cp data/en-dictionaries.json /tmp/base-dictionaries.json

      - name: Re-extract the English dictionaries
        id: extract
        continue-on-error: true
        run: node tools/extract-dictionaries.mjs --dsh-modules "$PWD/node_modules/@deepseek-ai" 2>&1 | tee /tmp/extract.log

      - name: Compare with the committed dictionaries
        id: drift
        if: steps.extract.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          node tools/drift-report.mjs --markdown --fail-on-change --base /tmp/base-dictionaries.json > /tmp/drift.md
          code=$?
          echo "$code" > /tmp/drift.code
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/drift.md

      - name: Show the report
        if: steps.extract.outcome == 'success'
        run: cat /tmp/drift.md

      - name: Open an issue when the dictionaries changed
        if: steps.drift.outcome == 'failure' && steps.drift.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='DSH の文言が更新されました'
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "既に同じタイトルの Issue が開いています。本文は上のレポートを参照してください。"
            exit 0
          fi
          gh issue create --title "$title" --body-file /tmp/drift.md

      - name: Open an issue when the check itself failed
        if: steps.extract.outcome == 'failure' || (steps.drift.outcome == 'failure' && steps.drift.outputs.code != '1')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='DSH の抽出または比較に失敗しました'
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "既に同じタイトルの Issue が開いています。"
            exit 0
          fi
          {
            echo 'DSH の辞書の抽出、または比較に失敗しました (差分の検出ではありません)。'
            echo
            echo 'インストール方法の変化か、DSH 側の変更でツールが動かなくなった可能性があります。'
            echo
            echo "実行: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -n 40 /tmp/extract.log 2>/dev/null || echo '(抽出ログなし)'
            echo
            echo '--- 比較の出力 ---'
            tail -n 40 /tmp/drift.md 2>/dev/null || echo '(比較の出力なし)'
            echo '```'
          } > /tmp/extract-issue.md
          gh issue create --title "$title" --body-file /tmp/extract-issue.md

      - name: Fail so the scheduled notification fires
        if: steps.extract.outcome == 'failure' || steps.drift.outcome == 'failure'
        run: |
          echo "DSH の確認に失敗しました (上の Issue / ログを参照してください)"
          exit 1

      - name: Summary
        if: steps.extract.outcome == 'success' && steps.drift.outcome == 'success'
        run: echo "DSH 側の辞書に差分はありません"
