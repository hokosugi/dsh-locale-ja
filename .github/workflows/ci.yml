name: ci

# push / PR ごとに、点検 (個人情報・秘密情報) と検証 (ビルド・監査・実物ランタイム) を回す。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 履歴のメールも見られるように

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install DSH into the project (実物ランタイム検証のため)
        # グローバルインストール (-g) は依存がネストしてクライアントバンドルが見えないため、
        # プロジェクト内に入れる (drift ワークフローと同じ理由)
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh

      - name: Scan for personal data and secrets
        run: npm run scan

      - name: Build, audit and verify
        run: npm run check
